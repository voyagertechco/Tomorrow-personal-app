<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Habits — Tomorrow</title>
<style>
body{margin:0;background:#FFF8F1;font-family:system-ui;color:#3B2F2F}
.header{padding:14px;background:linear-gradient(90deg,#10B981,#059669);color:white;border-radius:0 0 18px 18px}
.container{padding:14px}
.card{background:white;padding:14px;border-radius:16px;margin-bottom:14px;box-shadow:0 8px 20px rgba(0,0,0,.05)}
.habit{padding:10px 0;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px}
.habit-left{flex:1}
.habit-actions{display:flex;gap:8px}
input[type="text"]{width:100%;padding:10px;border-radius:10px;border:1px solid #eee;font-size:15px}
.btn{padding:10px;border-radius:12px;border:0;background:#10B981;color:white;width:100%;cursor:pointer}
.btn.small{padding:8px 10px;width:auto}
.empty{color:#7a6e6e;padding:8px;text-align:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <h1>Habits</h1>
  <small>Build consistency daily</small>
</div>

<div class="container">
  <div class="card">
    <input id="habitText" placeholder="New habit e.g. Drink water" type="text" />
    <button id="addBtn" class="btn" style="margin-top:8px">Add Habit</button>
  </div>

  <div class="card">
    <div id="habitsList"></div>
  </div>
</div>

<div class="bottom-nav"><a href="index.html">🏠</a></div>

<script>
/* Robust, awaited IndexedDB helpers + habit UI */
const DB_NAME = 'tomorrowai-db';
const DB_VER = 2;
const STORE = 'data';

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error || new Error('IDB open failed'));
  });
}

async function idbGetAll(){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readonly');
    const store = tx.objectStore(STORE);
    const r = store.getAll();
    r.onsuccess = e => res(e.target.result || []);
    r.onerror = e => rej(e.target.error || new Error('getAll failed'));
  });
}

async function idbPut(val){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    const req = store.put(val);
    req.onerror = e => rej(e.target.error || new Error('put failed'));
    tx.oncomplete = () => res(true);
    tx.onerror = e => rej(e.target.error || new Error('transaction failed'));
  });
}

async function idbDelete(key){
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    const store = tx.objectStore(STORE);
    const req = store.delete(key);
    req.onerror = e => rej(e.target.error || new Error('delete failed'));
    tx.oncomplete = () => res(true);
    tx.onerror = e => rej(e.target.error || new Error('transaction failed'));
  });
}

/* UI references */
const habitTextEl = document.getElementById('habitText');
const addBtn = document.getElementById('addBtn');
const habitsListEl = document.getElementById('habitsList');

function makeId(){ return 'habit_' + Date.now() + '_' + Math.floor(Math.random()*9999); }

async function render(){
  try{
    const all = await idbGetAll();
    const items = (all || []).filter(x => x && x.type === 'habit').sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
    if(items.length === 0){
      habitsListEl.innerHTML = '<div class="empty">No habits yet. Add one above.</div>';
      return;
    }
    habitsListEl.innerHTML = items.map(h => {
      const text = escapeHtml(h.text || '');
      const streak = Number(h.streak || 0);
      const last = h.last || '';
      return `
        <div class="habit" data-id="${h.id}">
          <div class="habit-left">
            <strong>${text}</strong><br/>
            <small>Streak: ${streak} day${streak===1?'':'s'} ${ last ? '· Last: ' + last : '' }</small>
          </div>
          <div class="habit-actions">
            <button class="btn small" data-action="done" data-id="${h.id}">Done Today</button>
            <button class="btn small" style="background:#ef4444" data-action="delete" data-id="${h.id}">Delete</button>
          </div>
        </div>`;
    }).join('');
  }catch(err){
    console.error('render err', err);
    habitsListEl.innerHTML = '<div class="empty">Error loading habits (see console).</div>';
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function addHabit(){
  const text = (habitTextEl.value || '').trim();
  if(!text) return habitTextEl.focus();
  const id = makeId();
  const rec = { id, type:'habit', text, streak:0, last:null, createdAt: Date.now() };
  try{
    await idbPut(rec);
    habitTextEl.value = '';
    await render();
  }catch(e){
    console.error('addHabit err', e);
    alert('Failed to add habit. See console.');
  }
}

async function markDone(id){
  try{
    const all = await idbGetAll();
    const h = all.find(x => x.id === id);
    if(!h) return;
    const today = new Date().toDateString();
    if(h.last !== today){
      h.streak = (Number(h.streak)||0) + 1;
      h.last = today;
      await idbPut(h);
    }
    await render();
  }catch(e){ console.error('markDone err', e); }
}

async function removeHabit(id){
  if(!confirm('Delete this habit?')) return;
  try{
    await idbDelete(id);
    await render();
  }catch(e){ console.error('remove err', e); }
}

/* event delegation for action buttons inside list */
habitsListEl.addEventListener('click', (ev)=>{
  const btn = ev.target.closest('button[data-action]');
  if(!btn) return;
  const action = btn.getAttribute('data-action');
  const id = btn.getAttribute('data-id');
  if(action === 'done') markDone(id);
  if(action === 'delete') removeHabit(id);
});

/* wire add */
addBtn.addEventListener('click', addHabit);
habitTextEl.addEventListener('keypress', (e)=>{ if(e.key === 'Enter') addHabit(); });

/* boot */
(async function init(){
  await render();
})();
</script>
</body>
</html>
