<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Goals — Tomorrow</title>

<style>
:root{
  --bg:#FFF8F1;
  --card:#FFFFFF;
  --muted:#7A6F66;
  --text:#3B2F2F;
  --accent:#F59E0B;
  --accent2:#F97316;
  --success:#22C55E;
  --danger:#EF4444;
  --radius:18px;
}

body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
  background:var(--bg);
  color:var(--text);
}

.header{
  padding:16px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#fff;
  border-radius:0 0 22px 22px;
}
.header h1{margin:0;font-size:19px}
.header .sub{font-size:12px;opacity:.9}

.container{
  padding:14px;
  max-width:480px;
  margin:auto;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.07);
}

label{font-size:13px;font-weight:600}
input,textarea{
  width:100%;
  padding:11px;
  border-radius:12px;
  border:1px solid #eee;
  font-size:14px;
  margin-top:6px;
}

.btn{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:0;
  cursor:pointer;
  background:var(--accent);
  color:white;
  font-weight:600;
  font-size:14px;
}

.btn.secondary{
  background:#F1E8DE;
  color:#3B2F2F;
}

.goal{
  padding:12px 0;
  border-bottom:1px solid #f0e7dc;
}
.goal:last-child{border-bottom:none}

.goal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.badge{
  font-size:11px;
  padding:4px 8px;
  border-radius:10px;
  font-weight:600;
}
.badge.done{background:#DCFCE7;color:#166534}
.badge.progress{background:#FEF3C7;color:#92400E}

.progress{
  height:9px;
  background:#F1E4D4;
  border-radius:10px;
  overflow:hidden;
  margin:6px 0;
}
.progress span{
  height:100%;
  display:block;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

.goal-actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.goal-actions button{
  flex:1;
  font-size:12px;
  padding:8px;
  border-radius:10px;
}

.small{font-size:12px;color:var(--muted)}

input[type="range"]{
  width:100%;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:center;
  padding:10px;
  box-shadow:0 -4px 10px rgba(0,0,0,.06);
}
.home-btn{
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  color:var(--text);
  font-weight:600;
}
.icon{width:22px;height:22px}
</style>
</head>

<body>

<div class="header">
  <h1>My Goals</h1>
  <div class="sub">Plan • Track • Achieve</div>
</div>

<div class="container">

  <!-- Add Goal -->
  <div class="card">
    <strong>Create a Goal</strong><br/><br/>

    <label>Title</label>
    <input id="goalTitle" placeholder="e.g. Buy a laptop"/>

    <label>Description</label>
    <textarea id="goalDesc" placeholder="Why this matters..."></textarea>

    <label>Target (%)</label>
    <input id="goalTarget" type="number" placeholder="100"/>

    <label>Deadline</label>
    <input id="goalDeadline" type="date"/>

    <button id="addGoal" class="btn" style="margin-top:10px">Save Goal</button>
  </div>

  <!-- Goals -->
  <div class="card">
    <strong>Your Goals</strong>
    <div id="goalsList" style="margin-top:10px"></div>
  </div>

</div>

<!-- Bottom Home -->
<div class="bottom-nav">
  <a href="index.html" class="home-btn">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M3 10L12 3l9 7v10a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>
    </svg>
    Home
  </a>
</div>

<script>
const DB_NAME='tomorrowai-db', DB_VER=3;

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('data')) db.createObjectStore('data',{keyPath:'id'});
    };
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbPut(val){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('data','readwrite');
    tx.objectStore('data').put(val);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function idbGetAll(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('data','readonly');
    const r=tx.objectStore('data').getAll();
    r.onsuccess=e=>res(e.target.result||[]);
    r.onerror=e=>rej(e.target.error);
  });
}
async function idbDelete(id){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('data','readwrite');
    tx.objectStore('data').delete(id);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}

function formatDate(ts){
  return new Date(ts).toLocaleDateString();
}

async function renderGoals(){
  const all=(await idbGetAll()).filter(x=>x.type==='goal').sort((a,b)=>b.ts-a.ts);
  const out=document.getElementById('goalsList');
  out.innerHTML='';
  if(all.length===0){
    out.innerHTML='<div class="small">No goals yet</div>';
    return;
  }
  all.forEach(g=>{
    const pct=Math.min(100,Math.max(0,g.progress||0));
    const achieved=pct>=g.target;
    const div=document.createElement('div');
    div.className='goal';
    div.innerHTML=`
      <div class="goal-header">
        <strong>${g.title}</strong>
        <span class="badge ${achieved?'done':'progress'}">
          ${achieved?'Achieved':'In progress'}
        </span>
      </div>
      <div class="small">${g.desc||''}</div>
      <div class="small">Created: ${formatDate(g.ts)} ${g.deadline?`• Deadline: ${g.deadline}`:''}</div>

      <div class="progress"><span style="width:${pct}%"></span></div>
      <div class="small">${pct}% / ${g.target}%</div>

      <input type="range" min="0" max="100" value="${pct}" oninput="updateProgress('${g.id}',this.value)"/>

      <div class="goal-actions">
        <button class="btn secondary" onclick="deleteGoal('${g.id}')">Delete</button>
      </div>
    `;
    out.appendChild(div);
  });
}

async function updateProgress(id,val){
  const num=Number(val);
  const all=await idbGetAll();
  const g=all.find(x=>x.id===id);
  if(!g)return;
  g.progress=num;
  await idbPut(g);
  renderGoals();
}

async function deleteGoal(id){
  if(!confirm('Delete this goal?'))return;
  await idbDelete(id);
  renderGoals();
}

document.getElementById('addGoal').onclick=async()=>{
  const title=goalTitle.value.trim();
  if(!title)return alert('Enter a title');
  const g={
    id:'goal_'+Date.now(),
    type:'goal',
    title,
    desc:goalDesc.value.trim(),
    target:Number(goalTarget.value)||100,
    deadline:goalDeadline.value||null,
    progress:0,
    ts:Date.now()
  };
  await idbPut(g);
  goalTitle.value=''; goalDesc.value=''; goalTarget.value=''; goalDeadline.value='';
  renderGoals();
};

renderGoals();
</script>
</body>
</html>
