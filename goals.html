<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Goals — Tomorrow</title>
<link rel="manifest" href="/manifest.json"/>
<style>
:root{
  --bg:#FFF8F1; --card:#FFFFFF; --muted:#7A6F66; --text:#3B2F2F;
  --accent:#F59E0B; --accent2:#F97316; --success:#22C55E; --radius:18px;
}
body{margin:0;font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";background:var(--bg);color:var(--text)}
.header{padding:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;border-radius:0 0 22px 22px}
.header h1{margin:0;font-size:19px}
.container{padding:14px;max-width:720px;margin:auto}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 10px 25px rgba(0,0,0,.07)}
label{font-size:13px;font-weight:600}
input,textarea{width:100%;padding:11px;border-radius:12px;border:1px solid #eee;font-size:14px;margin-top:6px}
.btn{width:100%;padding:12px;border-radius:14px;border:0;cursor:pointer;background:var(--accent);color:white;font-weight:600;font-size:14px}
.btn.secondary{background:#F1E8DE;color:#3B2F2F}
.goal{padding:12px 0;border-bottom:1px solid #f0e7dc}
.goal:last-child{border-bottom:none}
.badge{font-size:11px;padding:4px 8px;border-radius:10px;font-weight:600}
.badge.done{background:#DCFCE7;color:#166534}
.badge.progress{background:#FEF3C7;color:#92400E}
.progress{height:9px;background:#F1E4D4;border-radius:10px;overflow:hidden;margin:6px 0}
.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.goal-actions{display:flex;gap:8px;margin-top:8px}
.small{font-size:12px;color:var(--muted)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:10px;box-shadow:0 -4px 10px rgba(0,0,0,.06)}
.offline-banner{display:none;background:#fff3cd;padding:10px;border-radius:8px;border:1px solid #ffeeba;color:#856404;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">
  <h1>My Goals</h1>
  <div class="sub">Plan • Track • Achieve</div>
</div>

<div class="container">
  <div id="offlineBanner" class="offline-banner">Offline — this page is working from cache.</div>

  <div class="card">
    <strong>Create a Goal</strong><br/><br/>
    <label>Title</label><input id="goalTitle" placeholder="e.g. Buy a laptop"/>
    <label>Description</label><textarea id="goalDesc" placeholder="Why this matters..."></textarea>
    <label>Target (%)</label><input id="goalTarget" type="number" placeholder="100"/>
    <label>Deadline</label><input id="goalDeadline" type="date"/>
    <button id="addGoal" class="btn" style="margin-top:10px">Save Goal</button>
  </div>

  <div class="card">
    <strong>Your Goals</strong>
    <div id="goalsList" style="margin-top:10px"></div>
  </div>
</div>

<div class="bottom-nav"><a href="index.html" class="home-btn">Home</a></div>

<script>
/* offline + SW */
function showToast(msg,ms=1500){ const el=document.createElement('div'); el.style.position='fixed'; el.style.right='12px'; el.style.bottom='90px'; el.style.zIndex=16000; el.style.background='rgba(10,10,12,0.9)'; el.style.color='white'; el.style.padding='10px 14px'; el.style.borderRadius='8px'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),ms); }
const offlineBanner = document.getElementById('offlineBanner');
function updateOfflineUI(){ offlineBanner.style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', ()=>{ updateOfflineUI(); showToast('Online — syncing...'); });
window.addEventListener('offline', ()=>{ updateOfflineUI(); showToast('Offline'); });
updateOfflineUI();
async function registerSW(){ if(!('serviceWorker' in navigator)) return; try{ await navigator.serviceWorker.register('/sw.js', { scope: '/' }); navigator.serviceWorker.addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='DOWNLOAD_OFFLINE_DONE') showToast('Offline cache ready'); if(d.type==='SW_UPDATED'){ showToast('Updating...'); setTimeout(()=>location.reload(),700); } }); const keys = await caches.keys(); const shell = keys.find(k=>k.startsWith('tomorrow-shell-')); if(!shell && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type:'DOWNLOAD_OFFLINE' }); }catch(e){ console.warn(e); } }
registerSW();

/* IndexedDB helpers */
const DB_NAME='tomorrowai-db', DB_VER=3;
function openDB(){ return new Promise((res,rej)=>{ const rq=indexedDB.open(DB_NAME,DB_VER); rq.onupgradeneeded=e=>{ const db=e.target.result; if(!db.objectStoreNames.contains('data')) db.createObjectStore('data',{keyPath:'id'}); }; rq.onsuccess=e=>res(e.target.result); rq.onerror=e=>rej(e.target.error); }); }
async function idbPut(val){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction('data','readwrite'); tx.objectStore('data').put(val); tx.oncomplete=()=>res(true); tx.onerror=e=>rej(e.target.error); }); }
async function idbGetAll(){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction('data','readonly'); const r=tx.objectStore('data').getAll(); r.onsuccess=e=>res(e.target.result||[]); r.onerror=e=>rej(e.target.error); }); }
async function idbDelete(id){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction('data','readwrite'); tx.objectStore('data').delete(id); tx.oncomplete=()=>res(true); tx.onerror=e=>rej(e.target.error); }); }

function formatDate(ts){ return new Date(ts).toLocaleDateString(); }

async function renderGoals(){
  const all=(await idbGetAll()).filter(x=>x.type==='goal').sort((a,b)=>b.ts-a.ts);
  const out=document.getElementById('goalsList'); out.innerHTML='';
  if(all.length===0){ out.innerHTML='<div class="small">No goals yet</div>'; return; }
  all.forEach(g=>{
    const pct=Math.min(100,Math.max(0,g.progress||0));
    const achieved=pct>=g.target;
    const div=document.createElement('div'); div.className='goal';
    div.innerHTML=`
      <div class="goal-header">
        <strong>${escapeHtml(g.title)}</strong>
        <span class="badge ${achieved?'done':'progress'}">${achieved?'Achieved':'In progress'}</span>
      </div>
      <div class="small">${escapeHtml(g.desc||'')}</div>
      <div class="small">Created: ${formatDate(g.ts)} ${g.deadline?`• Deadline: ${g.deadline}`:''}</div>
      <div class="progress"><span style="width:${pct}%"></span></div>
      <div class="small">${pct}% / ${g.target}%</div>
      <input type="range" min="0" max="100" value="${pct}" oninput="updateProgress('${g.id}',this.value)"/>
      <div class="goal-actions"><button class="btn secondary" onclick="deleteGoal('${g.id}')">Delete</button></div>
    `;
    out.appendChild(div);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function updateProgress(id,val){ const num=Number(val); const all=await idbGetAll(); const g=all.find(x=>x.id===id); if(!g) return; g.progress=num; await idbPut(g); renderGoals(); }
async function deleteGoal(id){ if(!confirm('Delete this goal?')) return; await idbDelete(id); renderGoals(); }

document.getElementById('addGoal').onclick = async ()=>{
  const title = (document.getElementById('goalTitle')||{}).value.trim(); if(!title) return alert('Enter a title');
  const g = { id:'goal_'+Date.now(), type:'goal', title, desc:(document.getElementById('goalDesc')||{}).value.trim(), target: Number(document.getElementById('goalTarget')||0)||100, deadline: (document.getElementById('goalDeadline')||{}).value||null, progress:0, ts:Date.now() };
  await idbPut(g); document.getElementById('goalTitle').value=''; document.getElementById('goalDesc').value=''; document.getElementById('goalTarget').value=''; document.getElementById('goalDeadline').value=''; renderGoals();
};

(async function init(){ await renderGoals(); })();
</script>
</body>
</html>
